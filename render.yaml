## Render Blueprint — https://render.com/docs/blueprint-spec
## Deploys apps/web as a static site from this monorepo.
services:
  - type: web
    name: lending-force-web
    runtime: static
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter web build
    staticPublishPath: apps/web/dist
    pullRequestPreviewsEnabled: true
    domains:
      - app.lendingforce.com
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
    routes:
      # SPA fallback — any unknown path serves index.html
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 20.11.1
      - key: PNPM_VERSION
        value: 9.0.0
      # SHA-256 hash of the company PIN. To rotate: generate a new hash and
      # override this value in Render dashboard (Settings → Environment).
      # PowerShell one-liner to hash a new PIN:
      #   $p='NEWPIN'; ([System.Security.Cryptography.SHA256]::Create().ComputeHash([Text.Encoding]::UTF8.GetBytes($p)) | %{ $_.ToString('x2') }) -join ''
      - key: VITE_APP_PIN_HASH
        value: a149a0887f291c18ce725e842476bf129b953457cfa5189714bf4724b3024430
